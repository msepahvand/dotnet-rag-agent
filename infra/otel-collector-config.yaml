# ADOT Collector configuration for the ECS sidecar.
# Receives OTLP traces and metrics from the API container (localhost:4317/4318).
# Traces go to X-Ray; metrics use CloudWatch Embedded Metric Format. The
# collector inherits the AWS region from the ECS task's IAM role.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  awsxray:
  awsemf:
    namespace: RagAgent
    log_group_name: /aws/metrics/rag-agent
    log_stream_name: ecs

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsemf]
